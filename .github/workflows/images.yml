name: Images
# Publishes the controller, the attempt helper (ADR 0015) and the multica CLI artifact
# at multica.UpstreamRevision or an explicit compatible CLI commit (ADR 0014). Manual
# only: run it for the commit a deployment needs and pin the digests from the summary.
# Each image also leaves a release-<image>-<os>-<arch> artifact; deploy.yml (ADR 0031)
# rolls out the controller digest recorded for its commit.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        options: [linux/amd64, linux/arm64]
        default: linux/amd64
      cli_revision:
        description: Compatible Multica CLI commit (empty uses the pinned server revision)
        type: string
        required: false
        default: ''
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: multica-sandbox
          - image: multica-sandbox-helper
            target: helper
          - image: multica-sandbox-multica-cli
            file: deploy/multica-cli.Dockerfile
            upstream: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: upstream
        if: matrix.upstream
        env:
          CLI_REVISION: ${{ inputs.cli_revision }}
        run: |
          revision=$(sed -n 's/^const UpstreamRevision = "\([0-9a-f]\{40\}\)"$/\1/p' internal/multica/client.go)
          if [ -n "$CLI_REVISION" ]; then revision=$CLI_REVISION; fi
          [ "${#revision}" -eq 40 ] && printf '%s' "$revision" | grep -Eq '^[0-9a-f]{40}$' || {
            echo 'cli_revision must be a full lower-case commit hash' >&2
            exit 1
          }
          echo "contexts=multica=https://github.com/multica-ai/multica.git#$revision" >> "$GITHUB_OUTPUT"
          echo "args=REVISION=$revision" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-contexts: ${{ steps.upstream.outputs.contexts }}
          build-args: |
            ${{ steps.upstream.outputs.args }}
            SANDBOX_REVISION=${{ github.sha }}
          platforms: ${{ inputs.platform }}
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: release
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg image "$IMAGE" \
            --arg digest "$DIGEST" --arg platform "$PLATFORM" \
            '{sha: $sha, ref: $ref, image: $image, digest: $digest, platform: $platform}' > release.json
          echo "name=release-${{ matrix.image }}-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.release.outputs.name }}
          path: release.json
          if-no-files-found: error
