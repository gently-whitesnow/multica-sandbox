# Workspace virtual keys (Postgres-backed) grant models and budgets; no custom auth hook.
model_list:
  - model_name: fixture
    litellm_params:
      model: openai/fixture
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
  - model_name: fixture-new
    litellm_params:
      model: openai/fixture-new
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
  - model_name: ungranted
    litellm_params:
      model: openai/ungranted
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
