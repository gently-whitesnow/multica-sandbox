model_list:
  - model_name: fixture
    litellm_params:
      model: openai/fixture
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
  - model_name: fixture-new
    litellm_params:
      model: openai/fixture
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
  - model_name: fixture-limited
    litellm_params:
      model: openai/fixture
      api_base: http://fixture-provider:8080/v1
      api_key: os.environ/FIXTURE_UPSTREAM_KEY
      num_retries: 0
litellm_settings:
  set_verbose: false
  turn_off_message_logging: true
  enable_post_custom_auth_checks: true
general_settings:
  custom_auth: litellm_auth.authorize
  custom_auth_run_common_checks: true
