x-example: &example
  build:
    context: ../..
    dockerfile: examples/identity-mcp/Dockerfile
    target: fixture
  networks: [fixture]
services:
  seed:
    <<: *example
    command: [init]
    volumes:
      - realm:/realm
      - credentials:/secrets
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start-dev, --import-realm]
    networks: [fixture]
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - realm:/opt/keycloak/data/import:ro
  gateway:
    <<: *example
    networks:
      fixture:
        aliases: [fixture-provider]
    command: [gateway]
    restart: on-failure
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - credentials:/secrets:ro
    healthcheck:
      test: [CMD, /identity-example, health]
      interval: 2s
      timeout: 2s
      retries: 60
  # Inference profile: LiteLLM with virtual keys; reachable only from trusted services.
  litellm-db:
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    profiles: [inference]
    networks: [fixture]
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: fixture-only
    healthcheck:
      test: [CMD, pg_isready, -U, litellm, -d, litellm]
      interval: 2s
      timeout: 2s
      retries: 30
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839
    profiles: [inference]
    mem_limit: 768m
    cpus: 0.5
    networks: [fixture]
    depends_on:
      gateway:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    entrypoint: [/bin/sh, -c, 'export LITELLM_MASTER_KEY="sk-$$(cat /secrets/admin)"; export FIXTURE_UPSTREAM_KEY="$$(cat /secrets/upstream)"; exec litellm --config /fixture/litellm.yaml --port 4000']
    environment:
      DATABASE_URL: postgresql://litellm:fixture-only@litellm-db:5432/litellm
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - credentials:/secrets:ro
      - ./litellm.yaml:/fixture/litellm.yaml:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 2s
      timeout: 2s
      retries: 90
  # Repositories profile: an authenticated Git smart HTTP host behind the controller's Git relay.
  git:
    build:
      context: ../..
      dockerfile: examples/identity-mcp/Dockerfile
      target: git
    profiles: [repositories]
    networks: [fixture]
    command: [git]
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - credentials:/secrets:ro
    healthcheck:
      test: [CMD, /identity-example, health]
      interval: 2s
      timeout: 2s
      retries: 30
  scenario:
    <<: *example
    command: [scenario]
    profiles: [test]
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - credentials:/secrets:ro
networks:
  fixture:
    internal: true
volumes:
  realm:
  credentials:
