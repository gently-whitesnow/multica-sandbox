x-example: &example
  build:
    context: ../..
    dockerfile: examples/identity-mcp/Dockerfile
    target: fixture
  networks: [fixture]
services:
  seed:
    <<: *example
    command: [init]
    volumes:
      - realm:/realm
      - credentials:/secrets
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    command: [start-dev, --import-realm]
    networks: [fixture]
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - realm:/opt/keycloak/data/import:ro
  gateway:
    <<: *example
    networks:
      fixture:
        aliases: [fixture-provider]
    command: [gateway]
    restart: on-failure
    depends_on:
      keycloak:
        condition: service_started
    volumes:
      - credentials:/secrets:ro
    healthcheck:
      test: [CMD, /identity-example, health]
      interval: 2s
      timeout: 2s
      retries: 60
  scenario:
    <<: *example
    command: [scenario]
    profiles: [test]
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - credentials:/secrets:ro
networks:
  fixture:
    internal: true
volumes:
  realm:
  credentials:
