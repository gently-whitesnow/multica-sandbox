# Lima VM with Docker CE and Sysbox CE for nested-Docker attempts (ADR 0019). Docker
# Desktop cannot run Sysbox outside Enhanced Container Isolation, so macOS contributors
# use this VM. provision.sh installs the pinned Docker and Sysbox packages.
# Start it with examples/sysbox-host/up.sh; the host Docker context is not changed.
minimumLimaVersion: 2.0.0

vmType: vz
arch: aarch64
cpus: 6
memory: 6GiB
disk: 50GiB

images:
- location: "https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55"

# No host directories inside the VM: files enter through Docker build contexts.
mounts: []

containerd:
  system: false
  user: false

provision:
- mode: system
  file:
    url: provision.sh

# Rosetta only to check linux/amd64 builds; attempts never run emulated.
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# Only the Docker socket leaves the VM; guest TCP ports are not forwarded.
portForwards:
- guestSocket: "/var/run/docker.sock"
  hostSocket: "{{.Dir}}/sock/docker.sock"
- guestPortRange: [1, 65535]
  ignore: true

probes:
- description: "Docker and Sysbox installed by provision.sh"
  script: |
    #!/bin/bash
    set -eu
    timeout 600 bash -c 'until [ -e /var/lib/sysbox-host/provisioned ]; do sleep 5; done'
  hint: "Provision log: /var/log/cloud-init-output.log in the guest"

message: |
  docker --context lima-sysbox info
  Smoke: examples/sysbox-host/smoke.sh
