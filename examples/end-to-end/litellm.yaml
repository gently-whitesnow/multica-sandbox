model_list:
  - model_name: demo
    litellm_params:
      model: os.environ/UPSTREAM_MODEL
      api_base: http://cli-proxy:8317/v1
      api_key: os.environ/PROXY_BRIDGE_KEY
      max_tokens: 4096
      timeout: 60
      num_retries: 0
litellm_settings:
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true
# The workspace virtual key (created by setup) grants models and limits; no custom auth hook.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
